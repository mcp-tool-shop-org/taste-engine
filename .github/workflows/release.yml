name: Release

# Publishes @mcptoolshop/taste-engine to npm when a GitHub Release is published.
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN. The trusted publisher on npmjs.com
# is bound to this repo and this filename (release.yml), so do not rename this file.
# Org rule: a publish workflow fires on `release: published` only (it does not count
# against the two push-triggered workflows, ci.yml and pages.yml). Cut a release with
#   gh release create vX.Y.Z --target <commit> --notes-file <CHANGELOG section>
# and this workflow publishes the matching version. workflow_dispatch with `tag`
# re-runs it for an existing release, for example after a transient failure.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish (its code is built and published with this workflow)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false # never cancel an in-flight publish

jobs:
  publish:
    name: Publish to npm (Trusted Publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC handshake with npm, and the provenance attestation
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify the tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=${TAG} package.json=${PKG_VERSION}"
          if [ "${TAG#v}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the package shape
        run: npm pack --dry-run

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10. A pinned npm 11 goes into
      # a sandbox on PATH, and only after `npm ci`, the tests and the build: a newer npm run
      # before `npm ci` blocks dependency install scripts.
      - name: npm 11 for Trusted Publishing
        run: |
          SANDBOX="$HOME/.npm-cli-sandbox"
          mkdir -p "$SANDBOX"
          cd "$SANDBOX"
          echo '{"name":"npm-cli-sandbox","version":"0.0.0","private":true}' > package.json
          npm install --no-save --no-audit --no-fund --silent npm@^11.5.1
          echo "$SANDBOX/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Publish to npm with provenance (no token)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; nothing to publish"
            exit 0
          fi
          npm --version
          npm publish --provenance --access public
